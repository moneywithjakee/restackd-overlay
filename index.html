<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Restackd — Live Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800;900&family=JetBrains+Mono:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
   * Restackd Live Overlay v15.2
   *
   * Layout (HORIZONTAL — saves vertical real estate):
   *   ┌──────────────────────────────────────────────────────────┐
   *   │ LOGO · LIVE   ║   🔥 10 SPOTS LEFT · 3 SOLD              │  ← FOMO BAR (huge)
   *   ├──────────────────────────────────────────────────────────┤
   *   │  🟢 DARIO                       ┌───────────────┐         │
   *   │     JUST JOINED · $249 LIFETIME │ • Owen        │         │  ← spotlight LEFT
   *   │                                  │ • Carldelll   │         │     tail RIGHT
   *   │                                  │ • Smoke       │         │
   *   │                                  └───────────────┘         │
   *   └──────────────────────────────────────────────────────────┘
   *
   * Brand: lime #D1FE17 + ink #08090A + Plus Jakarta Sans + JetBrains Mono
   * ============================================================ */

  :root {
    --ink:        #08090A;
    --lime:       #D1FE17;
    --lime-dim:   rgba(209, 254, 23, 0.5);
    --hot:        #FF3B3B;
    --white:      #FFFFFF;
    --w-90:       rgba(255, 255, 255, 0.90);
    --w-60:       rgba(255, 255, 255, 0.60);
    --w-40:       rgba(255, 255, 255, 0.40);
    --w-08:       rgba(255, 255, 255, 0.08);
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--white);
    overflow: hidden;
  }

  .root {
    display: inline-block;
    padding: 18px;
  }

  .frame {
    display: flex;
    flex-direction: column;
    width: 1040px;
    border-radius: 22px;
    overflow: hidden;
    background: var(--ink);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow:
      0 36px 80px rgba(0, 0, 0, 0.78),
      0 0 0 1px rgba(209, 254, 23, 0.06);
    transform: translateZ(0);
  }

  /* ============================================================
   * HEADER — FOMO BAR. Logo on left, big spots block on right.
   * ============================================================ */
  .hdr {
    display: grid;
    grid-template-columns: auto 1px 1fr;
    align-items: stretch;
    gap: 20px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--w-08);
    background:
      radial-gradient(ellipse at right, rgba(209,254,23,0.10) 0%, transparent 65%),
      linear-gradient(180deg, rgba(255,255,255,0.018) 0%, transparent 100%);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand svg {
    width: 44px;
    height: 44px;
  }
  .wm {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.025em;
    line-height: 1;
  }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 900;
    color: var(--lime);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 5px 9px;
    border-radius: 6px;
    background: rgba(209, 254, 23, 0.12);
    border: 1px solid rgba(209, 254, 23, 0.35);
    margin-left: 4px;
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 10px rgba(209, 254, 23, 0.8);
    animation: pulse-dot 1.1s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.72); }
  }

  .divider {
    background: linear-gradient(180deg, transparent, var(--w-08) 30%, var(--w-08) 70%, transparent);
  }

  /* ============================================================
   * SPOTS FOMO BLOCK — the new hero. HUGE number + sold-today.
   * ============================================================ */
  .spots {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 18px;
  }
  .spots-flame {
    font-size: 56px;
    line-height: 1;
    animation: flame-flicker 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255, 100, 0, 0.6));
  }
  @keyframes flame-flicker {
    0%, 100% { transform: scale(1) rotate(-2deg); }
    50%      { transform: scale(1.06) rotate(3deg); }
  }
  .spots-num {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 112px;
    font-weight: 900;
    color: var(--lime);
    line-height: 1;
    letter-spacing: -0.06em;
    text-shadow:
      0 0 24px rgba(209, 254, 23, 0.65),
      0 0 60px rgba(209, 254, 23, 0.30);
    font-variant-numeric: tabular-nums;
  }
  .spots.urgent .spots-num {
    color: var(--hot);
    text-shadow:
      0 0 26px rgba(255, 59, 59, 0.7),
      0 0 70px rgba(255, 59, 59, 0.35);
    animation: spots-urgent-pulse 1s ease-in-out infinite;
  }
  @keyframes spots-urgent-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }
  .spots-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .spots-label {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--white);
    line-height: 1;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
  }
  .spots-sold {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px;
    font-weight: 800;
    color: var(--lime);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
    opacity: 0.9;
  }
  .spots-sold.zero {
    opacity: 0.4;
  }

  /* ============================================================
   * BODY — spotlight LEFT + tail RIGHT
   * ============================================================ */
  .body {
    padding: 18px;
    background: radial-gradient(ellipse at top left, rgba(209,254,23,0.04) 0%, transparent 60%);
  }

  .body-row {
    display: grid;
    grid-template-columns: 1fr 280px;
    align-items: stretch;
    gap: 14px;
  }

  /* SPOTLIGHT — newest buyer */
  .spot {
    position: relative;
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 20px;
    padding: 18px 22px;
    border-radius: 16px;
    background:
      linear-gradient(135deg, rgba(209,254,23,0.14) 0%, rgba(209,254,23,0.04) 100%);
    border: 2px solid rgba(209, 254, 23, 0.65);
    box-shadow:
      0 0 36px rgba(209, 254, 23, 0.30),
      inset 0 0 24px rgba(209, 254, 23, 0.08);
    overflow: hidden;
    align-items: center;
  }
  .spot::before {
    /* persistent shimmer sweep */
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(209,254,23,0.14) 50%, transparent 65%);
    transform: translateX(-100%);
    animation: shimmer 4.5s linear infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .spot.enter {
    animation: spot-enter 0.7s cubic-bezier(0.16, 1, 0.3, 1) both,
               spot-glow 1.8s ease-in-out 0.7s 3;
  }
  @keyframes spot-enter {
    0%   { opacity: 0; transform: translateY(-24px) scale(0.94); filter: blur(8px); }
    60%  { opacity: 1; transform: translateY(0) scale(1.02); filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes spot-glow {
    0%, 100% { box-shadow: 0 0 36px rgba(209,254,23,0.30), inset 0 0 24px rgba(209,254,23,0.08); }
    50%      { box-shadow: 0 0 64px rgba(209,254,23,0.65), inset 0 0 36px rgba(209,254,23,0.20); }
  }

  .avatar {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: linear-gradient(135deg, #D1FE17, #a3c413);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 900;
    line-height: 1;
    flex-shrink: 0;
    box-shadow:
      0 0 28px rgba(209, 254, 23, 0.55),
      0 0 0 4px rgba(209, 254, 23, 0.20);
  }

  .spot-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    min-width: 0;
  }
  .spot-name {
    font-size: 56px;
    font-weight: 900;
    color: var(--white);
    line-height: 1;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
  }
  .spot-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .spot-action {
    font-size: 18px;
    font-weight: 900;
    color: var(--lime);
    text-transform: uppercase;
    letter-spacing: 0.10em;
    line-height: 1;
    text-shadow: 0 0 12px rgba(209, 254, 23, 0.55);
  }
  .spot-pill {
    font-size: 16px;
    font-weight: 900;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--lime);
    color: var(--ink);
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .spot-empty {
    grid-column: 1 / -1;
    font-size: 26px;
    font-weight: 900;
    color: var(--w-40);
    font-style: italic;
    text-align: center;
    padding: 16px 0;
  }

  /* TAIL — vertical stack on the right side */
  .tail {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .tail-hdr {
    font-size: 10px;
    font-weight: 900;
    color: var(--w-60);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tail-hdr::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--w-40);
  }
  .tail-row {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 18px;
    font-weight: 800;
    line-height: 1;
    transition: opacity 0.4s ease;
    animation: tail-slide-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes tail-slide-in {
    0%   { opacity: 0; transform: translateX(8px); }
    100% { opacity: var(--tail-opacity, 1); transform: translateX(0); }
  }
  .tail-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    color: var(--w-90);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    line-height: 1;
    flex-shrink: 0;
  }
  .tail-name {
    font-weight: 900;
    color: var(--w-90);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .tail-row:nth-child(2) { --tail-opacity: 0.90; opacity: 0.90; }
  .tail-row:nth-child(3) { --tail-opacity: 0.65; opacity: 0.65; }
  .tail-row:nth-child(4) { --tail-opacity: 0.38; opacity: 0.38; }
  .tail-row:nth-child(n+5) { display: none; }

  /* Connection: hidden while healthy */
  .conn {
    position: absolute;
    bottom: 6px;
    right: 14px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px;
    color: var(--w-40);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    user-select: none;
  }
  .conn.offline { color: var(--hot); }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .live-dot, .spot::before, .spot.enter,
    .spots-flame, .spots.urgent .spots-num { animation: none !important; }
  }
</style>
</head>
<body>

<div class="root">
  <div class="frame" id="frame">

    <!-- ============================================================
         HEADER — FOMO BAR (logo · divider · SPOTS HERO)
         ============================================================ -->
    <div class="hdr">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <g>
            <rect x="0"  y="0"  width="64" height="16" rx="2.5" fill="#D1FE17"/>
            <rect x="0"  y="22" width="64" height="16" rx="2.5" fill="#F5F5F5"/>
            <rect x="0"  y="44" width="34" height="16" rx="2.5" fill="#7A7C80"/>
            <rect x="42" y="44" width="22" height="16" rx="2.5" fill="#7A7C80"/>
          </g>
        </svg>
        <span class="wm">restackd</span>
        <span class="live"><span class="live-dot"></span>LIVE</span>
      </div>

      <div class="divider"></div>

      <div class="spots" id="spots">
        <span class="spots-flame" aria-hidden="true">🔥</span>
        <span class="spots-num" id="spotsNum">10</span>
        <div class="spots-meta">
          <span class="spots-label">SPOTS LEFT TODAY</span>
          <span class="spots-sold zero" id="spotsSold">0 SOLD TODAY</span>
        </div>
      </div>
    </div>

    <!-- ============================================================
         BODY — SPOTLIGHT (left) + TAIL (right)
         ============================================================ -->
    <div class="body">
      <div class="body-row">

        <div class="spot" id="spot">
          <div class="spot-empty" id="spotEmpty">Waiting for the next sale…</div>
        </div>

        <div class="tail" id="tail">
          <div class="tail-hdr">RECENT</div>
        </div>

      </div>
    </div>

    <span class="conn" id="conn"></span>
  </div>
</div>

<script>
(() => {
  // ============================================================
  // CONFIG
  // ============================================================
  const API_BASE     = 'https://restackd.com';
  const TICKER_PATH  = '/api/founding/ticker';
  const SPOTS_PATH   = '/api/overlay/spots';
  const SSE_PATH     = '/api/overlay/stream';
  const POLL_MS      = 3000;
  const TAIL_MAX     = 3;
  const URGENT_AT    = 5;  // pulse red when spots <= 5

  // ============================================================
  // DOM refs
  // ============================================================
  const $spot      = document.getElementById('spot');
  const $tail      = document.getElementById('tail');
  const $spotsBlk  = document.getElementById('spots');
  const $spotsNum  = document.getElementById('spotsNum');
  const $spotsSold = document.getElementById('spotsSold');
  const $conn      = document.getElementById('conn');

  // ============================================================
  // STATE
  // ============================================================
  let buyers     = [];  // { name, when } — newest at index 0
  let lastSeenId = null;
  let spots      = 10;
  let soldToday  = 0;

  // ============================================================
  // RENDER
  // ============================================================
  function cap(s) {
    if (!s) return '';
    return s[0].toUpperCase() + s.slice(1).toLowerCase();
  }
  function initial(s) {
    return (s || '?')[0].toUpperCase();
  }
  function renderSpot(b, animate) {
    if (!b) {
      $spot.innerHTML = `<div class="spot-empty">Waiting for the next sale…</div>`;
      $spot.classList.remove('enter');
      return;
    }
    $spot.classList.remove('enter');
    void $spot.offsetWidth;
    // No "X days ago" — keeps the newest buyer feeling immediate.
    $spot.innerHTML = `
      <div class="avatar">${initial(b.name)}</div>
      <div class="spot-text">
        <div class="spot-name">${cap(b.name)}</div>
        <div class="spot-meta">
          <span class="spot-action">JUST JOINED</span>
          <span class="spot-pill">$249 LIFETIME</span>
        </div>
      </div>
    `;
    if (animate) $spot.classList.add('enter');
  }
  function renderTail() {
    const rest = buyers.slice(1, 1 + TAIL_MAX);
    $tail.innerHTML = `<div class="tail-hdr">RECENT</div>` + rest.map((b) => `
      <div class="tail-row">
        <div class="tail-avatar">${initial(b.name)}</div>
        <div class="tail-name">${cap(b.name)}</div>
      </div>
    `).join('');
  }
  function renderSpots() {
    $spotsNum.textContent = String(Math.max(0, spots));
    if (spots <= URGENT_AT) {
      $spotsBlk.classList.add('urgent');
    } else {
      $spotsBlk.classList.remove('urgent');
    }
  }
  function renderSold() {
    const n = Math.max(0, soldToday);
    $spotsSold.textContent = `${n} SOLD TODAY`;
    $spotsSold.classList.toggle('zero', n === 0);
  }

  // ============================================================
  // UPDATE — called on every new sale (poll or SSE)
  // ============================================================
  function applyBuyer(entry, animate) {
    if (!entry?.name) return;
    const id = `${entry.position ?? ''}-${entry.name}`;
    if (id === lastSeenId) return;
    const firstSeen = lastSeenId === null;
    lastSeenId = id;
    buyers = [{ name: entry.name, when: entry.timeLabel || 'just now' }, ...buyers.filter(b => b.name !== entry.name)].slice(0, 1 + TAIL_MAX);
    renderSpot(buyers[0], animate && !firstSeen);
    renderTail();
  }
  function applySpots(remaining) {
    if (typeof remaining !== 'number') return;
    spots = remaining;
    renderSpots();
  }
  function applySold(n) {
    if (typeof n !== 'number') return;
    soldToday = n;
    renderSold();
  }

  // ============================================================
  // CONNECTION INDICATOR — silent while healthy
  // ============================================================
  function markConn(state) {
    if (state === 'offline') {
      $conn.textContent = '● offline';
      $conn.classList.add('offline');
    } else {
      $conn.textContent = '';
      $conn.classList.remove('offline');
    }
  }

  // ============================================================
  // SSE — best-effort. Poll is the real update path.
  // ============================================================
  let es = null;
  function openSSE() {
    try {
      es = new EventSource(`${API_BASE}${SSE_PATH}`);
      es.addEventListener('message', (ev) => {
        try {
          const p = JSON.parse(ev.data);
          if (p?.name && typeof p?.position === 'number') {
            applyBuyer({ name: cap(p.name), position: p.position, timeLabel: p.timeLabel || 'just now' }, true);
          }
          if (typeof p?.spotsRemaining === 'number') applySpots(p.spotsRemaining);
          if (typeof p?.soldToday      === 'number') applySold(p.soldToday);
        } catch {}
      });
      es.addEventListener('error', () => {
        if (es && es.readyState === EventSource.CLOSED) {
          es.close(); es = null;
          setTimeout(openSSE, 4000);
        }
      });
    } catch {
      // SSE unavailable — poll handles updates.
    }
  }

  // ============================================================
  // POLL — every POLL_MS. Seeds tail from entries[].
  // ============================================================
  async function poll() {
    try {
      const [tr, sr] = await Promise.all([
        fetch(`${API_BASE}${TICKER_PATH}`, { cache: 'no-store', mode: 'cors' }),
        fetch(`${API_BASE}${SPOTS_PATH}`,  { cache: 'no-store', mode: 'cors' }),
      ]);
      let healthy = false;
      if (tr.ok) {
        healthy = true;
        const td = await tr.json();
        const entries = Array.isArray(td.entries) ? td.entries : [];
        if (entries.length > 0) {
          const newId = `${entries[0].position ?? ''}-${entries[0].name}`;
          const isNewer = newId !== lastSeenId;
          if (isNewer || buyers.length === 0) {
            buyers = entries.slice(0, 1 + TAIL_MAX).map(e => ({
              name: cap(e.name),
              when: e.timeLabel || 'just now',
            }));
            const firstSeen = lastSeenId === null;
            lastSeenId = newId;
            renderSpot(buyers[0], !firstSeen && isNewer);
            renderTail();
          }
        } else if (td.latestEntry) {
          applyBuyer(td.latestEntry, false);
        }
      }
      if (sr.ok) {
        healthy = true;
        const sd = await sr.json();
        if (typeof sd.remaining === 'number') applySpots(sd.remaining);
        if (typeof sd.soldToday === 'number') applySold(sd.soldToday);
      }
      if (healthy) markConn('ok');
    } catch {
      markConn('offline');
    }
  }

  // ============================================================
  // BOOT
  // ============================================================
  renderSpots();
  renderSold();
  poll();
  setInterval(poll, POLL_MS);
  openSSE();
})();
</script>

</body>
</html>
