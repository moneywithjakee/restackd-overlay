<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Restackd — Live Overlay · Variant A (Hype Stack)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
   * Restackd Live Overlay — VARIANT A · "HYPE STACK"
   * Direction: Hype-Energy (Robinhood / Cash App).
   * Vertical 9:16 side-rail. Big lime SEATS number hero, price
   * card, live buyer card that flashes lime on a sale, recent tail.
   * Closest to Jake's original vertical concept, modernized to $249.
   *
   * Layout (vertical, pinned top-left of TikTok portrait frame):
   *   ┌────────────────┐
   *   │ ▦ restackd ●LIVE│  brand
   *   ├────────────────┤
   *   │       7        │  BIG seats number
   *   │  SEATS LEFT    │
   *   │  3 sold today  │
   *   ├────────────────┤
   *   │ $249 LIFETIME  │  price card
   *   │ TAP @bio       │  cta
   *   ├────────────────┤
   *   │ 🟢 DARIO  #75  │  newest buyer (lime on new)
   *   │ JUST JOINED    │
   *   ├────────────────┤
   *   │ • Owen         │  recent tail (faded)
   *   │ • Carldelll    │
   *   │ • Smoke        │
   *   └────────────────┘
   *
   * PERF: GPU-only (transform + opacity). Static shadows. No
   * continuous loops on hot paths — only event triggers animate,
   * which encodes cleanly through TikTok's H.264 re-encode.
   * ============================================================ */

  :root {
    --ink:        #08090A;
    --ink-2:      #0F1012;
    --ink-3:      #13141A;
    --line:       #1C1D20;
    --lime:       #D1FE17;
    --bone:       #F5F5F5;
    --hot:        #FF3B3B;
    --w-90:       rgba(245, 245, 245, 0.90);
    --w-60:       rgba(245, 245, 245, 0.55);
    --w-40:       rgba(245, 245, 245, 0.38);
    --w-08:       rgba(255, 255, 255, 0.07);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--bone);
    overflow: hidden;
  }

  .root { display: inline-block; padding: 22px; }

  /* The vertical rail */
  .rail {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 384px;
    border-radius: 26px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--ink-2) 0%, var(--ink) 70%);
    border: 1px solid var(--w-08);
    box-shadow: 0 40px 90px rgba(0,0,0,0.80);
    transform: translateZ(0);
    will-change: transform;
  }

  /* top lime accent edge */
  .rail::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--lime) 25%, var(--lime) 75%, transparent);
    opacity: 0.7;
    z-index: 6;
  }

  .confetti {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 7;
    transform: translateZ(0); will-change: transform;
  }
  .money-rain { position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }

  /* ---------- BRAND ---------- */
  .brand {
    display: flex; align-items: center; gap: 11px;
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--w-08);
  }
  .brand svg { width: 34px; height: 34px; flex-shrink: 0; }
  .wm { font-size: 24px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: auto;
    font-size: 11px; font-weight: 800; color: var(--lime);
    letter-spacing: 0.16em; text-transform: uppercase;
    padding: 5px 9px; border-radius: 6px;
    background: rgba(209,254,23,0.12);
    border: 1px solid rgba(209,254,23,0.30);
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 9px rgba(209,254,23,0.8);
    animation: dot-pulse 1.6s linear infinite;
    will-change: opacity;
  }
  @keyframes dot-pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* ---------- SEATS HERO ---------- */
  .seats {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 22px 20px;
    text-align: center;
  }
  .seats-num {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 150px; font-weight: 800; color: var(--lime);
    line-height: 0.92; letter-spacing: -0.06em;
    text-shadow: 0 0 22px rgba(209,254,23,0.45);
    font-variant-numeric: tabular-nums;
  }
  .seats-num.roll { animation: odometer 0.5s cubic-bezier(0.16,1,0.3,1); }
  @keyframes odometer {
    0%{transform:translate3d(0,-55%,0);opacity:0;} 40%{opacity:1;} 100%{transform:translate3d(0,0,0);opacity:1;}
  }
  .seats.urgent .seats-num { color: var(--hot); text-shadow: 0 0 24px rgba(255,59,59,0.5); }
  .seats-label {
    font-size: 22px; font-weight: 900; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--bone); line-height: 1;
    margin-top: 6px;
  }
  .seats-sold {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 16px; font-weight: 800; color: var(--lime);
    letter-spacing: 0.04em; text-transform: uppercase;
    margin-top: 10px; opacity: 0.95;
    transition: opacity 0.3s ease;
  }
  .seats-sold.zero { opacity: 0.38; }
  .seats-sold.bump { animation: bump 0.6s cubic-bezier(0.16,1,0.3,1); }
  @keyframes bump { 0%{transform:scale(1);} 30%{transform:scale(1.22);} 100%{transform:scale(1);} }

  /* ---------- PRICE CARD (rotates: price  <->  $0-down BNPL) ---------- */
  .price {
    position: relative;
    margin: 0 18px 14px;
    padding: 13px 16px;
    border-radius: 16px;
    background: var(--lime);
    color: var(--ink);
    box-shadow: 0 0 28px rgba(209,254,23,0.28);
    overflow: hidden;
    /* fixed height so the two crossfading frames don't reflow the rail */
    height: 96px;
  }
  /* Each rotating frame is absolutely stacked; only one is visible at a time */
  .price-frame {
    position: absolute;
    inset: 12px 16px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 3px;
    text-align: center;
    opacity: 0;
    transform: translate3d(0, 8px, 0);
    transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16,1,0.3,1);
    will-change: opacity, transform;
    pointer-events: none;
  }
  .price-frame.show { opacity: 1; transform: translate3d(0, 0, 0); }
  .price-row { display: flex; align-items: baseline; justify-content: center; gap: 9px; }
  .price-amt { font-size: 52px; font-weight: 900; letter-spacing: -0.05em; line-height: 1; }
  .price-term { font-size: 17px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; }
  .price-cta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px; font-weight: 800; letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-top: 5px;
  }
  /* BNPL frame — "$0 DOWN" is the loud centered line, provider logos underneath */
  .bnpl-top { display: flex; align-items: baseline; justify-content: center; gap: 9px; }
  .bnpl-amt { font-size: 48px; font-weight: 900; letter-spacing: -0.05em; line-height: 1; }
  .bnpl-lead { font-size: 17px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; }
  .bnpl-logos {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 7px;
  }
  .bnpl-chip {
    display: inline-flex; align-items: center;
    background: var(--ink); border-radius: 7px;
    padding: 5px 11px; line-height: 1;
  }
  .bnpl-chip svg { display: block; height: 15px; width: auto; }

  /* ---------- NEWEST BUYER ---------- */
  .buyer {
    position: relative;
    margin: 0 18px 12px;
    padding: 14px 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(209,254,23,0.12), rgba(209,254,23,0.03));
    border: 1.5px solid rgba(209,254,23,0.55);
    display: grid; grid-template-columns: 52px 1fr; gap: 13px;
    align-items: center;
    box-shadow: 0 0 26px rgba(209,254,23,0.22), inset 0 0 0 1px rgba(209,254,23,0.18);
    overflow: hidden;
  }
  .buyer.enter { animation: buyer-enter 0.7s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes buyer-enter {
    0%{opacity:0;transform:translate3d(0,-22px,0) scale(0.94);}
    60%{opacity:1;transform:translate3d(0,0,0) scale(1.03);}
    100%{opacity:1;transform:translate3d(0,0,0) scale(1);}
  }
  .buyer-av {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #D1FE17, #a3c413);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; line-height: 1;
    box-shadow: 0 0 18px rgba(209,254,23,0.4), 0 0 0 3px rgba(209,254,23,0.18);
    flex-shrink: 0;
  }
  .buyer.enter .buyer-av { animation: av-spin 0.9s cubic-bezier(0.16,1,0.3,1) 0.1s; }
  @keyframes av-spin { 0%{transform:rotate(-180deg) scale(0.6);} 100%{transform:rotate(0) scale(1);} }
  .buyer-txt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .buyer-name {
    font-size: 31px; font-weight: 900; color: var(--bone);
    line-height: 1; letter-spacing: -0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .buyer-meta { display: flex; align-items: center; gap: 9px; }
  .buyer-tag {
    font-size: 14px; font-weight: 900; color: var(--lime);
    letter-spacing: 0.07em; text-transform: uppercase; line-height: 1;
  }
  .buyer-pos {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px; font-weight: 800; color: var(--w-60);
    line-height: 1;
  }
  .buyer-empty {
    grid-column: 1 / -1;
    font-size: 16px; font-weight: 700; color: var(--w-40);
    text-align: center; padding: 8px 0; font-style: italic;
  }

  /* ---------- RECENT TAIL ---------- */
  .tail {
    margin: 0 18px 18px;
    padding: 12px 16px 6px;
    border-top: 1px solid var(--w-08);
  }
  .tail-hdr {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; font-weight: 800; color: var(--w-60);
    letter-spacing: 0.16em; text-transform: uppercase;
    margin-bottom: 11px;
    display: flex; align-items: center; gap: 7px;
  }
  .tail-hdr::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--lime); box-shadow: 0 0 7px rgba(209,254,23,0.7);
  }
  .tail-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 9px;
    animation: tail-in 0.55s cubic-bezier(0.16,1,0.3,1) both;
    will-change: transform, opacity;
  }
  @keyframes tail-in { 0%{opacity:0;transform:translate3d(0,8px,0);} 100%{opacity:var(--o,1);transform:translate3d(0,0,0);} }
  .tail-av {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--w-08); color: var(--w-90);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 900; line-height: 1; flex-shrink: 0;
  }
  .tail-name {
    font-size: 20px; font-weight: 800; color: var(--w-90);
    line-height: 1; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* header is child 1; first recent buyer (child 2) stays brightest, then fade */
  .tail-row:nth-child(2){--o:1;opacity:1;}
  .tail-row:nth-child(3){--o:0.7;opacity:0.7;}
  .tail-row:nth-child(4){--o:0.45;opacity:0.45;}
  .tail-row:nth-child(n+5){display:none;}

  .money-rain span {
    position: absolute; top: -40px; font-size: 30px;
    color: var(--lime); opacity: 0;
    will-change: transform, opacity;
    animation: money-fall 2.4s cubic-bezier(0.4,0,0.2,1) both;
    text-shadow: 0 0 12px rgba(209,254,23,0.6);
  }
  @keyframes money-fall {
    0%{opacity:0;transform:translate3d(0,-40px,0) rotate(-12deg);}
    15%{opacity:0.9;}
    100%{opacity:0;transform:translate3d(0,900px,0) rotate(28deg);}
  }

  .conn {
    position: absolute; bottom: 9px; right: 13px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px; color: var(--w-40);
    letter-spacing: 0.08em; text-transform: uppercase;
    user-select: none; z-index: 10;
  }
  .conn.offline { color: var(--hot); }

  @media (prefers-reduced-motion: reduce) {
    .live-dot, .seats-num.roll, .seats-sold.bump, .buyer.enter,
    .buyer.enter .buyer-av, .tail-row { animation: none !important; }
  }

  /* ============================================================
   * PURCHASE TAKEOVER — full-overlay celebration (~60s)
   * Fires ONLY on a real new sale. Heavy motion graphics:
   * radiating rays, slam-in name, popping avatar, shimmer pill,
   * sustained confetti on its own canvas. Auto-dismisses.
   * ============================================================ */
  .takeover {
    position: absolute; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    /* solid ink base so NOTHING from the rail bleeds through, with a lime glow on top */
    background: var(--ink);
    opacity: 0; visibility: hidden;
    pointer-events: none;
    overflow: hidden;
  }
  .takeover::before {
    content: ''; position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at center, rgba(209,254,23,0.20) 0%, rgba(8,9,10,0.4) 60%, transparent 100%);
  }
  .takeover.show {
    visibility: visible;
    animation: to-in 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .takeover.out {
    animation: to-out 0.6s cubic-bezier(0.4,0,1,1) forwards;
  }
  @keyframes to-in  { 0%{opacity:0;} 100%{opacity:1;} }
  @keyframes to-out { 0%{opacity:1;} 100%{opacity:0;visibility:hidden;} }

  .takeover-fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

  /* Radiating lime rays that slowly spin behind the content */
  .to-rays {
    position: absolute; top: 50%; left: 50%;
    width: 180%; aspect-ratio: 1; z-index: 0;
    transform: translate(-50%,-50%);
    background: repeating-conic-gradient(from 0deg,
      rgba(209,254,23,0.10) 0deg 7deg, transparent 7deg 22deg);
    animation: rays-spin 16s linear infinite;
    will-change: transform;
  }
  .takeover.show .to-rays { opacity: 1; }
  @keyframes rays-spin { 0%{transform:translate(-50%,-50%) rotate(0);} 100%{transform:translate(-50%,-50%) rotate(360deg);} }

  .to-inner {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 0 26px;
    width: 100%;
  }
  .to-eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 18px; font-weight: 800; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--lime);
    opacity: 0; animation: to-pop 0.6s cubic-bezier(0.16,1,0.3,1) 0.15s forwards;
  }
  .to-avatar {
    width: 132px; height: 132px; border-radius: 50%;
    margin: 22px 0 18px;
    background: linear-gradient(135deg, #D1FE17, #a3c413);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 900; line-height: 1;
    box-shadow: 0 0 46px rgba(209,254,23,0.6), 0 0 0 6px rgba(209,254,23,0.22);
    opacity: 0;
    animation: av-slam 0.7s cubic-bezier(0.16,1,0.3,1) 0.25s forwards,
               av-breathe 2.4s ease-in-out 1s infinite;
    will-change: transform;
  }
  @keyframes av-slam {
    0%{opacity:0;transform:scale(0.2) rotate(-160deg);}
    70%{opacity:1;transform:scale(1.12) rotate(8deg);}
    100%{opacity:1;transform:scale(1) rotate(0);}
  }
  @keyframes av-breathe { 0%,100%{box-shadow:0 0 46px rgba(209,254,23,0.6),0 0 0 6px rgba(209,254,23,0.22);} 50%{box-shadow:0 0 64px rgba(209,254,23,0.85),0 0 0 9px rgba(209,254,23,0.3);} }

  .to-name {
    font-size: 76px; font-weight: 900; color: var(--bone);
    line-height: 0.95; letter-spacing: -0.04em;
    max-width: 100%; word-break: break-word;
    text-shadow: 0 0 30px rgba(209,254,23,0.35);
    opacity: 0;
    animation: name-slam 0.75s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
    will-change: transform, opacity;
  }
  @keyframes name-slam {
    0%{opacity:0;transform:translate3d(0,30px,0) scale(0.7);}
    60%{opacity:1;transform:translate3d(0,0,0) scale(1.06);}
    100%{opacity:1;transform:translate3d(0,0,0) scale(1);}
  }
  .to-thanks {
    font-size: 26px; font-weight: 900; color: var(--lime);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-top: 14px; line-height: 1;
    opacity: 0; animation: to-pop 0.6s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
  }
  .to-pill {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 17px; font-weight: 800; letter-spacing: 0.04em;
    color: var(--ink); background: var(--lime);
    padding: 10px 18px; border-radius: 999px;
    margin-top: 20px; line-height: 1;
    position: relative; overflow: hidden;
    opacity: 0; animation: to-pop 0.6s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
  }
  /* shimmer sweep across the pill, looping */
  .to-pill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.55) 50%, transparent 70%);
    transform: translateX(-120%);
    animation: pill-shimmer 2.6s ease-in-out 1.4s infinite;
  }
  @keyframes pill-shimmer { 0%{transform:translateX(-120%);} 60%,100%{transform:translateX(120%);} }
  .to-sub {
    font-size: 19px; font-weight: 700; color: var(--w-90);
    margin-top: 18px; line-height: 1.3; letter-spacing: -0.01em;
    opacity: 0; animation: to-pop 0.6s cubic-bezier(0.16,1,0.3,1) 1.1s forwards;
  }
  @keyframes to-pop { 0%{opacity:0;transform:translate3d(0,12px,0);} 100%{opacity:1;transform:translate3d(0,0,0);} }

  @media (prefers-reduced-motion: reduce) {
    .to-rays, .to-avatar { animation: none !important; }
    .to-pill::after { animation: none !important; }
  }
</style>
</head>
<body>
<div class="root">
  <div class="rail" id="frame">
    <canvas class="confetti" id="confetti"></canvas>
    <div class="money-rain" id="moneyRain"></div>

    <!-- ============ PURCHASE TAKEOVER (full-overlay, ~60s) ============ -->
    <div class="takeover" id="takeover" aria-hidden="true">
      <canvas class="takeover-fx" id="takeoverFx"></canvas>
      <div class="to-rays"></div>
      <div class="to-inner">
        <div class="to-eyebrow">NEW MEMBER · JUST JOINED</div>
        <div class="to-avatar" id="toAvatar">D</div>
        <div class="to-name" id="toName">Dario</div>
        <div class="to-thanks">WELCOME TO RESTACKD</div>
        <div class="to-pill" id="toPill">$249 LIFETIME · FOUNDER #75</div>
        <div class="to-sub">Thank you for joining the movement</div>
      </div>
    </div>

    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Restackd">
        <g transform="translate(0,2)">
          <rect x="0"  y="0"  width="64" height="16" rx="2.5" fill="#D1FE17"/>
          <rect x="0"  y="22" width="64" height="16" rx="2.5" fill="#F5F5F5"/>
          <rect x="0"  y="44" width="34" height="16" rx="2.5" fill="#7A7C80"/>
          <rect x="42" y="44" width="22" height="16" rx="2.5" fill="#7A7C80"/>
        </g>
      </svg>
      <span class="wm">restackd</span>
      <span class="live"><span class="live-dot"></span>LIVE</span>
    </div>

    <div class="seats" id="seats">
      <span class="seats-num" id="seatsNum">10</span>
      <span class="seats-label">SEATS LEFT</span>
      <span class="seats-sold zero" id="seatsSold">0 SOLD TODAY</span>
    </div>

    <div class="price" id="price">
      <div class="price-frame show" id="priceFrame1">
        <div class="price-row">
          <span class="price-amt">$249</span>
          <span class="price-term">Lifetime · once</span>
        </div>
        <div class="price-cta">TAP @startwithjake BIO →</div>
      </div>
      <div class="price-frame" id="priceFrame2">
        <div class="bnpl-top">
          <span class="bnpl-amt">$0</span>
          <span class="bnpl-lead">down today</span>
        </div>
        <div class="bnpl-logos">
          <span class="bnpl-chip" aria-label="Klarna">
            <svg viewBox="0 0 80 22" xmlns="http://www.w3.org/2000/svg"><text x="0" y="17" font-family="Plus Jakarta Sans,sans-serif" font-size="19" font-weight="800" letter-spacing="-0.5" fill="#FFB3C7">Klarna.</text></svg>
          </span>
          <span class="bnpl-chip" aria-label="Afterpay">
            <svg viewBox="0 0 96 22" xmlns="http://www.w3.org/2000/svg"><text x="0" y="17" font-family="Plus Jakarta Sans,sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">after</text><text x="44" y="17" font-family="Plus Jakarta Sans,sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5" fill="#B2FCE4">pay</text></svg>
          </span>
        </div>
      </div>
    </div>

    <div class="buyer" id="buyer">
      <div class="buyer-empty" id="buyerEmpty">Waiting for the next sale…</div>
    </div>

    <div class="tail" id="tail">
      <div class="tail-hdr">JUST JOINED</div>
    </div>

    <span class="conn" id="conn"></span>
  </div>
</div>

<script>
(() => {
  const API_BASE='https://restackd.com', TICKER='/api/founding/ticker', SPOTS='/api/overlay/spots', SSE='/api/overlay/stream';
  const POLL_MS=3000, TAIL_MAX=3, URGENT_AT=5;
  const $frame=document.getElementById('frame'), $confetti=document.getElementById('confetti'), $moneyRain=document.getElementById('moneyRain');
  const $buyer=document.getElementById('buyer'), $tail=document.getElementById('tail'), $seats=document.getElementById('seats');
  const $seatsNum=document.getElementById('seatsNum'), $seatsSold=document.getElementById('seatsSold'), $conn=document.getElementById('conn');
  const $priceFrames=[document.getElementById('priceFrame1'), document.getElementById('priceFrame2')];
  const $takeover=document.getElementById('takeover'), $toFx=document.getElementById('takeoverFx');
  const $toName=document.getElementById('toName'), $toAvatar=document.getElementById('toAvatar'), $toPill=document.getElementById('toPill');

  let buyers=[], lastSeenId=null, spots=10, prevSpots=10, soldToday=0, prevSold=0;

  // ============================================================
  // PURCHASE TAKEOVER — full-overlay 60s celebration on a real sale
  // ============================================================
  const TAKEOVER_MS = 60000;          // hold the celebration ~60s
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let takeoverTimer = 0, toRaf = 0, toBurstTimer = 0, toActive = false;
  const toParts = [];
  let toCtx = null, toW = 0, toH = 0;

  function sizeToFx(){
    if(!$toFx) return;
    toW = $frame.clientWidth; toH = $frame.clientHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    $toFx.width = toW*dpr; $toFx.height = toH*dpr;
    $toFx.style.width = toW+'px'; $toFx.style.height = toH+'px';
    toCtx = $toFx.getContext('2d');
    toCtx.setTransform(dpr,0,0,dpr,0,0);
  }
  function toBurst(n){
    const colors=['#D1FE17','#a3c413','#F5F5F5','#FFB3C7','#B2FCE4'];
    for(let i=0;i<n;i++){
      const fromLeft = Math.random()<0.5;
      toParts.push({
        x: fromLeft ? -10 : toW+10,
        y: toH*0.2 + Math.random()*toH*0.4,
        vx: (fromLeft? 1:-1)*(4+Math.random()*7),
        vy: -(4+Math.random()*7),
        rot: Math.random()*6.28, vr:(Math.random()-0.5)*0.5,
        size: 6+Math.random()*8, color: colors[(Math.random()*colors.length)|0], life: 1,
      });
    }
    if(!toRaf) toRaf = requestAnimationFrame(toTick);
  }
  function toTick(){
    if(!toCtx){ toRaf=0; return; }
    toCtx.clearRect(0,0,toW,toH);
    const g=0.32, d=0.99;
    for(let i=toParts.length-1;i>=0;i--){
      const p=toParts[i]; p.vy+=g; p.vx*=d; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=0.006;
      if(p.life<=0||p.y>toH+30){ toParts.splice(i,1); continue; }
      toCtx.save(); toCtx.translate(p.x,p.y); toCtx.rotate(p.rot);
      toCtx.globalAlpha=Math.max(0,Math.min(1,p.life)); toCtx.fillStyle=p.color;
      toCtx.fillRect(-p.size/2,-p.size*0.2,p.size,p.size*0.4); toCtx.restore();
    }
    toRaf = (toParts.length>0 || toActive) ? requestAnimationFrame(toTick) : 0;
  }
  function endTakeover(){
    if(!toActive) return;
    toActive = false;
    clearTimeout(takeoverTimer); clearInterval(toBurstTimer);
    $takeover.classList.remove('show');
    $takeover.classList.add('out');
    setTimeout(()=>{ $takeover.classList.remove('out'); $takeover.setAttribute('aria-hidden','true'); }, 650);
  }
  // Fire the full-overlay celebration for buyer b. Restarts cleanly if a
  // second sale lands while one is already showing (newest buyer wins).
  function fireTakeover(b){
    if(!b || !$takeover) return;
    clearTimeout(takeoverTimer); clearInterval(toBurstTimer);
    $toName.textContent = cap(b.name);
    $toAvatar.textContent = initial(b.name);
    $toPill.textContent = b.position ? `$249 LIFETIME · FOUNDER #${b.position}` : '$249 LIFETIME';
    // restart entry animation
    $takeover.classList.remove('out','show'); void $takeover.offsetWidth;
    $takeover.setAttribute('aria-hidden','false');
    $takeover.classList.add('show');
    toActive = true;
    if(!reduceMotion){
      sizeToFx();
      toBurst(70);                                   // opening blast
      toBurstTimer = setInterval(()=>toBurst(14), 900); // sustained rain through the hold
    }
    takeoverTimer = setTimeout(endTakeover, TAKEOVER_MS);
  }

  // Price card rotation: $249 Lifetime  <->  $0 down / 4 interest-free (Klarna·Afterpay).
  // Crossfade every PRICE_ROTATE_MS. Honors prefers-reduced-motion (stays on frame 1).
  const PRICE_ROTATE_MS = 4500;
  let priceIdx = 0;
  function rotatePrice(){
    priceIdx = priceIdx === 0 ? 1 : 0;
    $priceFrames.forEach((el, i) => el && el.classList.toggle('show', i === priceIdx));
  }

  const cap=s=>!s?'':s[0].toUpperCase()+s.slice(1).toLowerCase();
  const initial=s=>(s||'?')[0].toUpperCase();

  function renderBuyer(b, animate){
    if(!b){ $buyer.innerHTML=`<div class="buyer-empty">Waiting for the next sale…</div>`; $buyer.classList.remove('enter'); return; }
    $buyer.classList.remove('enter'); void $buyer.offsetWidth;
    const pos = b.position ? `<span class="buyer-pos">#${b.position}</span>` : '';
    $buyer.innerHTML=`
      <div class="buyer-av">${initial(b.name)}</div>
      <div class="buyer-txt">
        <div class="buyer-name">${cap(b.name)}</div>
        <div class="buyer-meta"><span class="buyer-tag">JUST JOINED</span>${pos}</div>
      </div>`;
    if(animate) $buyer.classList.add('enter');
  }
  function renderTail(){
    const rest=buyers.slice(1,1+TAIL_MAX);
    $tail.innerHTML=`<div class="tail-hdr">JUST JOINED</div>`+rest.map(b=>`
      <div class="tail-row"><div class="tail-av">${initial(b.name)}</div><div class="tail-name">${cap(b.name)}</div></div>`).join('');
  }
  function renderSeats(animate){
    const v=String(Math.max(0,spots));
    if($seatsNum.textContent!==v){ $seatsNum.textContent=v; if(animate){ $seatsNum.classList.remove('roll'); void $seatsNum.offsetWidth; $seatsNum.classList.add('roll'); } }
    $seats.classList.toggle('urgent', spots<=URGENT_AT);
  }
  function renderSold(animate){
    const n=Math.max(0,soldToday), t=`${n} SOLD TODAY`;
    if($seatsSold.textContent!==t){ $seatsSold.textContent=t; $seatsSold.classList.toggle('zero',n===0);
      if(animate&&n>0){ $seatsSold.classList.remove('bump'); void $seatsSold.offsetWidth; $seatsSold.classList.add('bump'); } }
  }

  // confetti
  const ctx=$confetti.getContext('2d'); let cw=0,ch=0;
  function resizeConfetti(){ cw=$frame.clientWidth; ch=$frame.clientHeight; const dpr=Math.min(window.devicePixelRatio||1,2);
    $confetti.width=cw*dpr; $confetti.height=ch*dpr; $confetti.style.width=cw+'px'; $confetti.style.height=ch+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
  const parts=[];
  function burst(){ if(cw===0) resizeConfetti(); const colors=['#D1FE17','#a3c413','#F5F5F5']; const ox=cw/2, oy=ch*0.28;
    for(let i=0;i<30;i++){ const a=Math.random()*Math.PI*2, sp=6+Math.random()*10;
      parts.push({x:ox+(Math.random()*40-20),y:oy+(Math.random()*30-15),vx:Math.cos(a)*sp*0.7,vy:Math.sin(a)*sp*0.7-6,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4,size:5+Math.random()*7,color:colors[(Math.random()*colors.length)|0],life:1}); }
    if(!raf) raf=requestAnimationFrame(tick); }
  let raf=0;
  function tick(){ ctx.clearRect(0,0,cw,ch); const g=0.45,d=0.985;
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.vy+=g; p.vx*=d; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=0.012;
      if(p.life<=0||p.y>ch+20){ parts.splice(i,1); continue; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size*0.18,p.size,p.size*0.36); ctx.restore(); }
    raf = parts.length>0 ? requestAnimationFrame(tick) : 0; }

  function spawnMoney(n){ const sym=['$','$','$','💵','💰'];
    for(let i=0;i<n;i++){ const el=document.createElement('span'); el.textContent=sym[(Math.random()*sym.length)|0];
      el.style.left=(10+Math.random()*(cw-50))+'px'; el.style.animationDelay=(Math.random()*0.4)+'s'; el.style.fontSize=(22+Math.random()*14)+'px'; el.style.animationDuration=(1.8+Math.random()*1.2)+'s';
      $moneyRain.appendChild(el); setTimeout(()=>el.remove(),3500); } }

  function applyBuyer(entry, animate){
    if(!entry?.name) return; const id=`${entry.position??''}-${entry.name}`; if(id===lastSeenId) return;
    const first=lastSeenId===null; lastSeenId=id;
    buyers=[{name:entry.name,position:entry.position},...buyers.filter(b=>b.name!==entry.name)].slice(0,1+TAIL_MAX);
    const go=animate&&!first; renderBuyer(buyers[0],go); renderTail(); if(go){ burst(); fireTakeover(buyers[0]); }
  }
  function applySpots(r){ if(typeof r!=='number'||r===spots) return; prevSpots=spots; spots=r; renderSeats(prevSpots!==spots); }
  function applySold(n){ if(typeof n!=='number'||n===soldToday) return; prevSold=soldToday; soldToday=n; renderSold(true);
    if(n>prevSold&&prevSold!==0) spawnMoney(8); else if(n>prevSold) spawnMoney(5); }

  function markConn(s){ if(s==='offline'){ $conn.textContent='● offline'; $conn.classList.add('offline'); } else { $conn.textContent=''; $conn.classList.remove('offline'); } }

  let es=null;
  function openSSE(){ try{ es=new EventSource(`${API_BASE}${SSE}`);
    es.addEventListener('message',ev=>{ try{ const p=JSON.parse(ev.data);
      if(p?.name&&typeof p?.position==='number') applyBuyer({name:cap(p.name),position:p.position},true);
      if(typeof p?.spotsRemaining==='number') applySpots(p.spotsRemaining);
      if(typeof p?.soldToday==='number') applySold(p.soldToday); }catch{} });
    es.addEventListener('error',()=>{ if(es&&es.readyState===EventSource.CLOSED){ es.close(); es=null; setTimeout(openSSE,4000); } });
  }catch{} }

  async function poll(){
    try{ const [tr,sr]=await Promise.all([fetch(`${API_BASE}${TICKER}`,{cache:'no-store',mode:'cors'}),fetch(`${API_BASE}${SPOTS}`,{cache:'no-store',mode:'cors'})]);
      let healthy=false;
      if(tr.ok){ healthy=true; const td=await tr.json(); const entries=Array.isArray(td.entries)?td.entries:[];
        if(entries.length>0){ const newId=`${entries[0].position??''}-${entries[0].name}`; const isNew=newId!==lastSeenId;
          if(isNew||buyers.length===0){ buyers=entries.slice(0,1+TAIL_MAX).map(e=>({name:cap(e.name),position:e.position}));
            const first=lastSeenId===null; lastSeenId=newId; renderBuyer(buyers[0],!first&&isNew); renderTail(); if(!first&&isNew){ burst(); fireTakeover(buyers[0]); } } }
        else if(td.latestEntry) applyBuyer(td.latestEntry,false); }
      if(sr.ok){ healthy=true; const sd=await sr.json(); if(typeof sd.remaining==='number') applySpots(sd.remaining); if(typeof sd.soldToday==='number') applySold(sd.soldToday); }
      if(healthy) markConn('ok');
    }catch{ markConn('offline'); }
  }

  resizeConfetti();
  window.addEventListener('resize',resizeConfetti,{passive:true});
  renderSeats(false); renderSold(false); poll(); setInterval(poll,POLL_MS); openSSE();
  // Start price rotation unless the viewer prefers reduced motion.
  if(!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setInterval(rotatePrice, PRICE_ROTATE_MS);
  }

  // ---- DEMO / DRY-RUN ----------------------------------------------------
  // Open ?demo=1 to fire ONE test celebration ~1.5s after load (preview in
  // OBS before going live). Optional name: ?demo=Jake. Optional loop for a
  // continuous reel: ?demo=1&loop=1 re-fires ~8s after each one ends.
  // Demo mode never touches real data — it only triggers the takeover visual.
  try {
    const qp = new URLSearchParams(location.search);
    if (qp.has('demo')) {
      const raw = qp.get('demo');
      const demoName = (raw && raw !== '1' && raw !== 'true') ? raw : 'Mariana';
      const demoLoop = qp.has('loop');
      const runDemo = () => fireTakeover({ name: demoName, position: 77 });
      setTimeout(function tick(){
        runDemo();
        if (demoLoop) setTimeout(tick, TAKEOVER_MS + 8000); // hold + 8s gap, then again
      }, 1500);
    }
  } catch {}
})();
</script>
</body>
</html>
